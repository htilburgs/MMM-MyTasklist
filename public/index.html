<h2 id="tasksTitle">Mijn Taken</h2>
<select id="langSelect"> ... </select>
<form id="taskForm"> ... </form>
<ul id="taskList"></ul>
<script>
const taskList = document.getElementById("taskList");
const taskForm = document.getElementById("taskForm");
const taskText = document.getElementById("taskText");
const tasksTitle = document.getElementById("tasksTitle");
const langSelect = document.getElementById("langSelect");
const addBtn = document.getElementById("addBtn");

let tasksData = { tasks_title: "Mijn Taken", tasks: [] };
let translations = {};
let lang = navigator.language.startsWith("en")?"en":navigator.language.startsWith("de")?"de":navigator.language.startsWith("fr")?"fr":"nl";
langSelect.value = lang;

// WebSocket
const ws = new WebSocket(`ws://${window.location.hostname}:8123`);
ws.onmessage = event => {
  const data = JSON.parse(event.data);
  if(data.type==="TASKS"){
    tasksData = data.tasks;
    tasksTitle.textContent = translations.TASKS_TITLE || tasksData.tasks_title || "Mijn Taken";
    renderTasks(tasksData.tasks);
  }
};

// Translations
async function loadTranslations(){
  try{
    const res = await fetch(`/api/lang?lang=${lang}`);
    translations = await res.json();
  }catch{ translations={}; }
  applyTranslations();
}

function applyTranslations(){
  tasksTitle.textContent = translations.TASKS_TITLE || tasksData.tasks_title || "Mijn Taken";
  taskText.placeholder = translations.PLACEHOLDER || "New task...";
  addBtn.textContent = translations.ADD_BUTTON || "Add";
  document.querySelectorAll(".delete-btn").forEach(btn=>btn.textContent = translations.DELETE_BUTTON || "Delete");
}

langSelect.addEventListener("change", async ()=>{
  lang = langSelect.value;
  await loadTranslations();
});

// Render
function renderTasks(taskArray){
  taskList.innerHTML="";
  (taskArray||[]).forEach(task=>{
    const li = document.createElement("li");
    li.dataset.id = task.id;
    if(task.done) li.classList.add("done");

    const label = document.createElement("label");
    const checkbox = document.createElement("input");
    checkbox.type="checkbox";
    checkbox.checked=task.done;
    checkbox.addEventListener("change", async ()=>{ await toggleTask(task.id); });
    label.appendChild(checkbox);
    label.appendChild(document.createTextNode(task.text));

    const deleteBtn = document.createElement("button");
    deleteBtn.className="delete-btn";
    deleteBtn.addEventListener("click", async ()=>{ await deleteTask(task.id); });

    li.appendChild(label);
    li.appendChild(deleteBtn);
    taskList.appendChild(li);
  });
  applyTranslations();
}

// Add / Toggle / Delete
taskForm.addEventListener("submit", async e=>{
  e.preventDefault();
  const text = taskText.value.trim();
  if(!text) return;
  if(ws.readyState===WebSocket.OPEN){
    await fetch("/api/tasks", {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({text})});
    taskText.value="";
  }
});

async function toggleTask(id){ if(ws.readyState===WebSocket.OPEN) await fetch(`/api/toggle/${id}`, {method:"POST"}); }
async function deleteTask(id){ if(ws.readyState===WebSocket.OPEN) await fetch(`/api/delete/${id}`, {method:"POST"}); }

// Init
async function init(){ await loadTranslations(); }
init();
</script>
