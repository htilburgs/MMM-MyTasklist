<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MyTasklist Webinterface</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<select id="langSelect">
  <option value="nl">Nederlands</option>
  <option value="en">English</option>
  <option value="de">Deutsch</option>
  <option value="fr">Français</option>
</select>

<form id="taskForm">
  <input type="text" id="taskText" placeholder="Nieuwe taak..." required>
  <button type="submit" id="addBtn">Toevoegen</button>
</form>

<div class="filters">
  <button class="filter-btn active" data-filter="all">Alle</button>
  <button class="filter-btn" data-filter="active">Actief</button>
  <button class="filter-btn" data-filter="done">Gereed</button>
</div>

<ul id="taskList"></ul>

<script src="script.js"></script>
</body>
</html>
