<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Mijn Taken</title>
  <style>
    body { background: #0e0e0e; color: #fff; font-family: Arial; margin: 20px; }
    h1 { font-weight: 300; margin-bottom: 15px; }
    input { padding: 8px; font-size: 16px; background: #222; color: #fff; border: 1px solid #333; border-radius: 4px; width: 60%; }
    button { padding: 8px 12px; margin-left: 4px; font-size: 14px; background: #444; color: #fff; border: none; border-radius: 4px; cursor: pointer; }
    button:hover { background: #666; }
    ul { list-style: none; margin-top: 20px; padding: 0; }
    li { background: #1b1b1b; margin-bottom: 6px; padding: 10px; border-radius: 4px; display: flex; align-items: center; gap: 10px; }
    li button { margin-left: auto; background: #aa3333; }
    li button:hover { background: #cc4444; }
    li input[type="checkbox"] { transform: scale(1.3); }
  </style>
</head>
<body>
  <h1>Mijn Taken</h1>
  <input id="taskInput" placeholder="Nieuwe taak">
  <button onclick="addTask()">Toevoegen</button>
  <ul id="tasks"></ul>

  <script>
    async function loadTasks() {
      const res = await fetch("/api/tasks");
      const tasks = await res.json();
      const ul = document.getElementById("tasks");
      ul.innerHTML = "";

      tasks.forEach(t => {
        const li = document.createElement("li");
        li.innerHTML = `
          <input type="checkbox" ${t.done ? "checked" : ""} onchange="toggleTask(${t.id})">
          ${t.text}
          <button onclick="deleteTask(${t.id})">X</button>
        `;
        ul.appendChild(li);
      });
    }

    async function addTask() {
      const input = document.getElementById("taskInput");
      if (!input.value) return;
      await fetch("/api/tasks", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ text: input.value }) });
      input.value = "";
      loadTasks();
    }

    async function toggleTask(id) {
      await fetch(`/api/toggle/${id}`, { method: "POST" });
      loadTasks();
    }

    async function deleteTask(id) {
      await fetch(`/api/delete/${id}`, { method: "POST" });
      loadTasks();
    }

    loadTasks();
  </script>
</body>
</html>
