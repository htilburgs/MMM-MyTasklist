<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <title>My Tasklist</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <h1>Mijn taken</h1>

  <!-- Taalkeuze -->
  <div class="input-row">
    <label for="langSelect" style="margin-right:8px;">Taal:</label>
    <select id="langSelect">
      <option value="nl">Nederlands</option>
      <option value="en">English</option>
      <option value="de">Deutsch</option>
      <option value="fr">Français</option>
    </select>
  </div>

  <!-- Taak invoer -->
  <div class="input-row">
    <input id="taskInput" placeholder="">
    <button id="addBtn"></button>
  </div>

  <ul id="tasks"></ul>

  <script>
    const taskInput = document.getElementById("taskInput");
    const addBtn = document.getElementById("addBtn");
    const tasksUl = document.getElementById("tasks");
    const langSelect = document.getElementById("langSelect");

    // Taal laden en instellen
    async function loadLang(lang) {
      const selectedLang = lang || langSelect.value || "nl";
      const res = await fetch(`/api/lang?lang=${selectedLang}`);
      const t = await res.json();

      window.MM_TASKS_PLACEHOLDER = t.PLACEHOLDER;
      window.MM_TASKS_ADD = t.ADD_TASK;

      taskInput.placeholder = t.PLACEHOLDER;
      addBtn.textContent = t.ADD_TASK;

      localStorage.setItem("myTasklistLang", selectedLang);
    }

    // Event: taal wijzigen
    langSelect.addEventListener("change", () => loadLang(langSelect.value).then(loadTasks));

    // Taken ophalen en sorteren (open boven)
    async function loadTasks() {
      const res = await fetch("/api/tasks");
      let tasks = await res.json();

      // Sorteer: open taken boven, voltooide onder
      tasks.sort((a, b) => (a.done === b.done ? 0 : a.done ? 1 : -1));

      tasksUl.innerHTML = "";

      tasks.forEach(task => {
        const li = document.createElement("li");
        li.innerHTML = `
          <input type="checkbox" ${task.done ? "checked" : ""} onchange="toggleTask(${task.id})">
          <span class="task-text ${task.done ? "done" : ""}">${task.text}</span>
          <button class="delete-btn" onclick="deleteTask(${task.id})">✕</button>
        `;
        tasksUl.appendChild(li);
      });
    }

    // Voeg taak toe
    async function addTask() {
      const text = taskInput.value.trim();
      if (!text) return;

      await fetch("/api/tasks", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ text })
      });

      taskInput.value = "";
      loadTasks();
    }

    // Toggle done
    async function toggleTask(id) {
      await fetch(`/api/toggle/${id}`, { method: "POST" });
      loadTasks();
    }

    // Delete taak
    async function deleteTask(id) {
      await fetch(`/api/delete/${id}`, { method: "POST" });
      loadTasks();
    }

    // Event listeners
    addBtn.addEventListener("click", addTask);
    taskInput.addEventListener("keypress", e => { if (e.key === "Enter") addTask(); });

    // Init: opgeslagen taal of browser taal
    const savedLang = localStorage.getItem("myTasklistLang");
    const browserLang = window.navigator.language.slice(0,2);
    loadLang(savedLang || browserLang || "nl").then(() => {
      langSelect.value = savedLang || browserLang || "nl";
      loadTasks();
    });
  </script>
</body>
</html>
